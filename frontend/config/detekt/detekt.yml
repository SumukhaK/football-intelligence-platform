# Detekt settings for the Compose Multiplatform app. Built on detekt's default
# config (buildUponDefaultConfig), with the usual Compose adjustments: composable
# functions are PascalCase, and layout code is full of dp sizes and colours.

build:
  maxIssues: 0

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable

style:
  # Previews are private and only called by Android Studio's preview renderer.
  UnusedPrivateMember:
    ignoreAnnotated:
      - Preview
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreAnnotated:
      - Composable
      - Preview
    excludes:
      - '**/test/**'
      - '**/commonTest/**'
      - '**/androidUnitTest/**'

complexity:
  TooManyFunctions:
    ignoreAnnotatedFunctions:
      - Preview
  LongMethod:
    ignoreAnnotated:
      - Composable
  LongParameterList:
    ignoreAnnotated:
      - Composable
