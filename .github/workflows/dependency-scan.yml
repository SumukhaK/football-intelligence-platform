name: Dependency Vulnerability Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # Weekly, so a newly published advisory is caught without a code change.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  python:
    name: Python (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # Audits exactly what uv.lock installs, runtime and dev, by hash.
      - name: Audit locked dependencies
        run: |
          uv export --frozen --extra dev --no-emit-project --format requirements-txt > requirements.txt
          uvx pip-audit@2.7.3 --disable-pip --require-hashes -r requirements.txt

  gradle:
    name: Gradle (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Records the shipped app's release runtime dependencies, all modules'
      # included, in app/gradle.lockfile; the build itself is not locked.
      - name: Resolve release dependencies
        working-directory: frontend
        run: >
          ./gradlew --no-daemon --no-configuration-cache
          --init-script ../.github/scripts/lock-all.gradle.kts
          :app:resolveReleaseDependencies --write-locks
          -PstagingBaseUrl=https://staging.invalid

      - name: Install OSV-Scanner
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          echo "f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

      - name: Scan
        run: ./osv-scanner scan source --lockfile frontend/app/gradle.lockfile
