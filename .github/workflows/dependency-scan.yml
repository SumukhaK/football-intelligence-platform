name: Dependency Vulnerability Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    # Weekly, so a newly published advisory is caught without a code change.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  python:
    name: Python (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # Audits exactly what uv.lock installs, runtime and dev, by hash.
      - name: Audit locked dependencies
        run: |
          uv export --frozen --extra dev --no-emit-project --format requirements-txt > requirements.txt
          uvx pip-audit@2.7.3 --disable-pip --require-hashes -r requirements.txt

  gradle-graph:
    name: Gradle (submit dependency graph)
    # The graph feeds GitHub's advisories and the review below.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Submit the Gradle dependency graph
        uses: gradle/actions/dependency-submission@v4
        with:
          build-root-directory: frontend
        env:
          ORG_GRADLE_PROJECT_stagingBaseUrl: https://staging.invalid

  review:
    name: Dependency review (all ecosystems)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails a pull request that adds a dependency with a known advisory.
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
