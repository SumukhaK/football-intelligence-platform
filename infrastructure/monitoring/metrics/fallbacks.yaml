name: fallbacks
description: Degraded paths taken instead of the normal one (fallback).
filter: >-
  resource.type="cloud_run_revision" AND resource.labels.service_name=("football-api" OR "football-api-staging")
  AND jsonPayload.event="fallback"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  labels:
    - key: from_path
      valueType: STRING
      description: The normal path that was skipped.
    - key: to_path
      valueType: STRING
      description: The degraded path taken instead.
labelExtractors:
  from_path: EXTRACT(jsonPayload.attributes.from_path)
  to_path: EXTRACT(jsonPayload.attributes.to_path)
