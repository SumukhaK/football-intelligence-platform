name: api_rate_limited
description: Requests rejected by the rate limiter with a 429 (ratelimit.rejected).
filter: >-
  resource.type="cloud_run_revision" AND resource.labels.service_name=("football-api" OR "football-api-staging")
  AND jsonPayload.event="ratelimit.rejected"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
