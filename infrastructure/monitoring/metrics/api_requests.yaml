name: api_requests
description: Requests served, by route template and status class (http.request).
filter: >-
  resource.type="cloud_run_revision" AND resource.labels.service_name=("football-api" OR "football-api-staging")
  AND jsonPayload.event="http.request"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  labels:
    - key: route
      valueType: STRING
      description: Route template, never the raw path.
    - key: status_class
      valueType: STRING
      description: First digit of the HTTP status, so "5" means 5xx.
labelExtractors:
  route: EXTRACT(jsonPayload.attributes.route)
  status_class: REGEXP_EXTRACT(jsonPayload.attributes.status, "^([1-5])[0-9][0-9]$")
