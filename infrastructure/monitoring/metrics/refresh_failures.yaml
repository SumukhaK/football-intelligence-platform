name: refresh_failures
description: Daily data refresh attempts that failed (refresh.run).
filter: >-
  resource.type="cloud_run_revision" AND resource.labels.service_name=("football-api" OR "football-api-staging")
  AND jsonPayload.event="refresh.run"
  AND jsonPayload.attributes.status="failed"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
