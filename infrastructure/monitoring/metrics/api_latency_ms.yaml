name: api_latency_ms
description: Request latency in milliseconds, by route template (http.request).
filter: >-
  resource.type="cloud_run_revision" AND resource.labels.service_name=("football-api" OR "football-api-staging")
  AND jsonPayload.event="http.request"
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: ms
  labels:
    - key: route
      valueType: STRING
      description: Route template, never the raw path.
labelExtractors:
  route: EXTRACT(jsonPayload.attributes.route)
valueExtractor: EXTRACT(jsonPayload.attributes.duration_ms)
bucketOptions:
  exponentialBuckets:
    numFiniteBuckets: 20
    growthFactor: 1.6
    scale: 5
