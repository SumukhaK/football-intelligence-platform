name: dependency_failures
description: Failed attempts of outbound calls (dependency.call not ok).
filter: >-
  resource.type="cloud_run_revision" AND resource.labels.service_name=("football-api" OR "football-api-staging")
  AND jsonPayload.event="dependency.call"
  AND NOT jsonPayload.attributes.status="ok"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  labels:
    - key: dependency
      valueType: STRING
      description: The called service, for example workers_ai.
    - key: status
      valueType: STRING
      description: timeout, http_error, connection_error or error.
labelExtractors:
  dependency: EXTRACT(jsonPayload.attributes.dependency)
  status: EXTRACT(jsonPayload.attributes.status)
